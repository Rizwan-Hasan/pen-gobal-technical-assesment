services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sms
      POSTGRES_PASSWORD: sms
      POSTGRES_DB: sms
    ports:
      - "5432:5432"
    volumes:
      - sms_pgdata:/var/lib/postgresql/data
    # Lets `docker compose up -d --wait` block until Postgres accepts queries,
    # so `make dev` never races the first Prisma command.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sms -d sms"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  sms_pgdata:
